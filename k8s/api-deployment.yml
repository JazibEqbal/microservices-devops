apiVersion: apps/v1
kind: Deployment

metadata:
  name: api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api-container
          image: devops-app:2.0

          ports:
            - containerPort: 8000

          env:
            - name: MESSAGE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config-map
                  key: MESSAGE_SERVICE_URL

            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DEMO_API_KEY