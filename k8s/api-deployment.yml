apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-deployment
  namespace: devops

spec:
#  replicas: 1

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
#      serviceAccountName: api-service-account

      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: api-container
#          image: devops-app:4.0
          image: ghcr.io/jazibeqbal/microservices-devops/devops-app:4d1b17b92d661b26cd823b4f98e0d4f09fa2bbf6

          ports:
            - containerPort: 8000

          env:
            - name: MESSAGE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config-map
                  key: MESSAGE_SERVICE_URL

            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DEMO_API_KEY

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"