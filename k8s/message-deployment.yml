apiVersion: apps/v1
kind: Deployment

metadata:
  name: message-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: message-service

  template:

    metadata:
      labels:
        app: message-service

    spec:
      containers:
        - name: message-service-container
          image: message-service:1.0
          ports:
            - containerPort: 9000

          readinessProbe:
            httpGet:
              path: /health
              port: 9000

          livenessProbe:
            httpGet:
              path: /health
              port: 9000