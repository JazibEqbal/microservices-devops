name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

  build:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APP Image
        run: docker build -t ${{ env.IMAGE_NAME }}/devops-app:${{ github.sha }} .

      - name: Build Message Service Image
        run: docker build -t ${{ env.IMAGE_NAME }}/message-service:${{ github.sha }} ./message-service/

      - name: Build Food Service Image
        run: docker build -t ${{ env.IMAGE_NAME }}/food-service:${{ github.sha }} ./food-service/