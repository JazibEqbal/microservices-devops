name: Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Check Docker
        run: docker --version

      - name: Check kubectl
        run: kubectl version --client

      - name: Check Minikube
        run: minikube status

      - name: Check Kubernetes
        run: kubectl get nodes