services:
  api:
    build:
      context: .
    container_name: devops-app
    ports:
      - "8000:8000"
    depends_on:
      message-service: # Start message-service before starting api
        condition: service_healthy

  message-service:
    build:
      context: ./message-service

    container_name: message-svc

    volumes:
      - message-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  message-data: # declaring named volume